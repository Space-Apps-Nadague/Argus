# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - argus-space

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies, build, and test
        run: |
          npm ci
          npm run build
          npm run typecheck:server
          npm test

      - name: Prune devDependencies and stage runtime package
        run: |
          npm prune --omit=dev
          mkdir -p "${{ runner.temp }}/argus-deploy"
          cp -a package.json package-lock.json dist server shared src data SOURCES.md node_modules "${{ runner.temp }}/argus-deploy/"

      # The server reads `.env` at start-up (server/env.ts); App Service settings still win over it.
      # It sits outside `dist/`, the only folder served to browsers, so the key never reaches clients.
      - name: Add AI key to the runtime package
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::warning::GEMINI_API_KEY secret is empty: production will run without an AI model."
            exit 0
          fi
          umask 077
          printf 'GEMINI_API_KEY=%s\nAI_PROVIDERS=gemini\n' "$GEMINI_API_KEY" > "${{ runner.temp }}/argus-deploy/.env"
          echo "Wrote .env with GEMINI_API_KEY and AI_PROVIDERS=gemini"

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'argus-space'
          slot-name: 'Production'
          package: ${{ runner.temp }}/argus-deploy
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_80B16C0ACA444A479559082CD8DBDB1C }}
