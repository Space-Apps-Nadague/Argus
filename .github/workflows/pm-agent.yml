name: ARGUS Autonomous PM Agent

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'specs/**'
      - '.agents/skills/pm-agent/**'
      - '.github/workflows/pm-agent.yml'
  schedule:
    # Runs hourly during daytime (08:00–23:00 UTC+2 / 06:00–21:00 UTC), skipping night hours
    - cron: '0 6-21 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run audit in dry-run mode without creating/closing issues'
        required: false
        default: false
        type: boolean
      max_new:
        description: 'Maximum number of new issues to open in this run (0-3)'
        required: false
        default: '2'
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: argus-pm-agent
  cancel-in-progress: false

jobs:
  pm-audit:
    name: Audit Specs, GitHub Issues & Projects Kanban
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 20

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install PM Agent Gemini SDK
        run: npm install --no-save @google/genai

      - name: Verify unit tests & production build
        run: |
          npm test
          npm run build

      - name: Run ARGUS PM Agent Audit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_PROJECT_TOKEN: ${{ secrets.GH_PROJECT_TOKEN }}
          PM_PROJECT_NUMBER: ${{ vars.PM_PROJECT_NUMBER || secrets.PM_PROJECT_NUMBER }}
          PM_PROJECT_OWNER: ${{ vars.PM_PROJECT_OWNER || secrets.PM_PROJECT_OWNER }}
          PM_DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: |
          node .agents/skills/pm-agent/scripts/run-pm-audit.mjs --max-new "${{ inputs.max_new || '2' }}"
