# Optional: run a local model server for teammates who don't have Ollama installed.
#   docker compose up -d ollama
#   docker compose exec ollama ollama pull qwen3:8b
# then set AI_LOCAL_MODEL=qwen3:8b in .env and run `npm run dev:local`.
services:
  # Local PostgreSQL matching the Azure Flexible Server (PG 17). specs/05-data-platform.md §2
  #   docker compose up -d postgres
  #   DATABASE_URL=postgres://argus:argus@localhost:5432/argus
  # No Docker? Use DATABASE_URL=pglite:./.data/argus (embedded Postgres, nothing to install).
  postgres:
    image: pgvector/pgvector:0.8.0-pg17
    environment:
      POSTGRES_USER: argus
      POSTGRES_PASSWORD: argus
      POSTGRES_DB: argus
    ports:
      - "5432:5432"
    volumes:
      - argus-pg:/var/lib/postgresql/data
    restart: unless-stopped

  ollama:
    image: ollama/ollama:0.12.6
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    restart: unless-stopped

  # On-ship speech for the deep-space tier (specs/04-ai-backend.md §4.2) [SRC-095].
  #   docker compose up -d speaches
  #   then set AI_LOCAL_SPEECH_BASE_URL=http://localhost:8000/v1 and run `npm run ai:local`.
  # GPU: use image ghcr.io/speaches-ai/speaches:latest-cuda.
  speaches:
    image: ghcr.io/speaches-ai/speaches:latest-cpu
    ports:
      - "8000:8000"
    volumes:
      - speaches-models:/home/ubuntu/.cache/huggingface/hub
    restart: unless-stopped

  whatsapp-bot:
    profiles: ["whatsapp"]
    build:
      context: ./tools/whatsapp-bot
    env_file:
      - path: .env
        required: false
    environment:
      - WHATSAPP_DB_PATH=/data/whatsapp.db
    volumes:
      - .:/workspace
      - whatsapp-session:/data
    stdin_open: true
    tty: true
    restart: unless-stopped

volumes:
  ollama-models:
  speaches-models:
  argus-pg:
  whatsapp-session:
